name: Publish

# Publishing is authenticated by the GitHub OIDC token, not by a credential in this
# repository: the job asks npm for a short-lived token scoped to this workflow, so no
# NPM_TOKEN secret exists and no interactive 2FA is involved. That matters here because
# the account's second factor is a security key, which the CLI cannot answer for (the
# legacy flow has no WebAuthn, and the web flow hands the token back over a connection
# that a filtering proxy can strand).
#
# One-time setup on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub, with
# owner `Sddft97`, repository `dsh-client-ui-skin-verdandi` and workflow `publish.yml`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the release job creates the GitHub release for the tag
  id-token: write # the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # `prepublishOnly` rebuilds, retests and typechecks, so the tarball cannot ship a
      # stale lib/. Provenance is attached because the OIDC token can sign it.
      - run: npm publish --access public --provenance

      - name: Show the published dist-tags
        run: npm view "$(node -p "require('./package.json').name")" dist-tags

      # The release is bound to the tag object, so a re-tagged version loses its release
      # silently -- which is how 0.1.7 first shipped to npm with none. Creating it here
      # keeps the four-way agreement (tag / package.json / changelog / tarball) closed
      # without a manual step, and `release edit` makes a re-run of this job idempotent.
      - name: Create the GitHub release from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { on = 1 }
            on && index($0, "## [") == 1 && index($0, v) != 1 { exit }
            on
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file /tmp/notes.md --verify-tag \
            || gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file /tmp/notes.md
