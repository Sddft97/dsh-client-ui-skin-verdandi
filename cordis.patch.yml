# Verdandi skin bundle patch: inserts its dshClient row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile web add <path-or-git-url>`; mutual exclusion between
# skins is managed by dsh-skin / skin-switcher style home-layer disabled rows.
- insert:
    - id: ui-skin-verdandi
      name: '@hjbztlbr/dsh-client-ui-skin-verdandi'
