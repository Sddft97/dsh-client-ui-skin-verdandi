  <text x="1375" y="790" text-anchor="middle" fill="#8E2438" opacity=".62" font-family="Microsoft YaHei, sans-serif" font-size="14">双人物舞台 · hero 80% → active 50%</text>

  <!-- Reading cards. -->
  <rect x="430" y="158" width="780" height="168" rx="15" fill="#FFFFFF" stroke="#D8C9C3" filter="url(#shadow)"/>
  <rect x="452" y="182" width="112" height="24" rx="12" fill="#F7E9EC"/>
  <text x="470" y="199" fill="#8E2438" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">VERDANDI</text>
  <g fill="#38242A" font-family="Microsoft YaHei, sans-serif" font-size="16">
    <text x="452" y="238">主工作区保持婚纱白，正文使用墨褐色。</text>
    <text x="452" y="270">角色、花瓣和圣树纹样只存在于留白区，不进入文本列。</text>
    <text x="452" y="302">工具调用、代码块和第三方面板保留自己的颜色语义。</text>
  </g>
  <rect x="704" y="348" width="506" height="78" rx="15" fill="#FAEDF0" stroke="#D9A7B1"/>
  <text x="730" y="380" fill="#4A3037" font-family="Microsoft YaHei, sans-serif" font-size="16">用户消息使用浅玫瑰白，不使用整块深红。</text>
  <text x="730" y="407" fill="#7B5D65" font-family="Microsoft YaHei, sans-serif" font-size="14">白色负责内容，红色负责方向。</text>

  <!-- Composer oath card. -->
  <rect x="430" y="650" width="874" height="152" rx="22" fill="#FFFDFC" stroke="#8E2438" stroke-width="3" filter="url(#shadow)"/>
  <rect x="438" y="658" width="858" height="136" rx="16" fill="none" stroke="#D6B873"/>
  <path d="M810 650q22-26 44 0q22-26 44 0v22q-22-13-44 1q-22-14-44-1z" fill="#FFFDFC" stroke="#D6B873"/>
