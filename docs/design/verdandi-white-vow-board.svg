<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E2438"/>
      <stop offset="1" stop-color="#651525"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset=".5" stop-color="#FFF9F4"/>
      <stop offset="1" stop-color="#F6EAE5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F7F1EC"/>
    </linearGradient>
    <radialGradient id="rose" cx="72%" cy="12%" r="70%">
      <stop offset="0" stop-color="#F3DDE1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFFDFC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#41101D" flood-opacity=".18"/>
    </filter>
    <pattern id="runes" width="54" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 9h14l5-6 6 12 6-12 5 6h14" fill="none" stroke="#D9BD82" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#E9E1DC"/>
