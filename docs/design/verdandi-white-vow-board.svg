  <text x="470" y="706" fill="#9A7A82" font-family="Microsoft YaHei, sans-serif" font-size="17">给智能体发送消息</text>
  <circle cx="476" cy="760" r="22" fill="#FFF9F2" stroke="#D6B873"/>
  <text x="476" y="767" text-anchor="middle" fill="#8E2438" font-size="20">＋</text>
  <circle cx="1248" cy="760" r="24" fill="#8E2438" stroke="#D6B873"/>
  <text x="1248" y="768" text-anchor="middle" fill="#FFFDFC" font-size="22">↑</text>
  <text x="1188" y="765" text-anchor="end" fill="#5E444B" font-family="Segoe UI, sans-serif" font-size="14">DeepSeek · Max</text>

  <!-- Zone legend. -->
  <g transform="translate(1168 135)" font-family="Microsoft YaHei, sans-serif">
    <rect width="346" height="116" rx="14" fill="#FFFDFC" stroke="#D8C9C3"/>
    <circle cx="28" cy="30" r="9" fill="#8E2438"/><text x="47" y="36" fill="#38242A" font-size="14">深红：导航 / 身份 / 状态</text>
    <circle cx="28" cy="60" r="9" fill="#FFFDFC" stroke="#C9BAB4"/><text x="47" y="66" fill="#38242A" font-size="14">婚纱白：阅读 / 编辑 / 弹窗</text>
    <circle cx="28" cy="90" r="9" fill="#C7A86B"/><text x="47" y="96" fill="#38242A" font-size="14">柔金：边框 / 选中 / 纹章</text>
  </g>
