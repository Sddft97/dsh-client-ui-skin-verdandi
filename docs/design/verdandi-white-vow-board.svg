  <!-- Veil, bouquet, rings and ribbons remain behind the real header controls. -->
  <g transform="translate(935 65)">
    <path d="M-500 15Q-260-26 0-2Q260-26 500 15" fill="none" stroke="#E3D4CC" stroke-width="3"/>
    <circle cx="-12" cy="-5" r="11" fill="none" stroke="#C7A86B" stroke-width="4"/>
    <circle cx="12" cy="-5" r="11" fill="none" stroke="#C7A86B" stroke-width="4"/>
    <path d="M-34 4q-28 10-42 34q28-14 48-9M34 4q28 10 42 34q-28-14-48-9" fill="#8E2438"/>
