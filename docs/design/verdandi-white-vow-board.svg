  <rect x="342" y="32" width="1218" height="820" fill="#D9C8B5"/>
  <path d="M342 118h1218v734H342z" fill="#7C6757" opacity=".14"/>
  <path d="M342 120h400v732H342zM1208 120h352v732h-352z" fill="#A8794D" opacity=".18"/>
