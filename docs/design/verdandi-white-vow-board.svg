  <rect x="342" y="32" width="1218" height="8" fill="#8E2438"/>
  <rect x="342" y="40" width="1218" height="2" fill="#D6B873"/>
  <path d="M342 117h1218" stroke="#D6B873" stroke-width="2"/>
