    <text x="90" y="518" fill="#E8C8CE">aether story studio</text>
  </g>
  <!-- Portrait bridal CG is cropped into the sidebar instead of becoming a floating card. -->
  <path d="M62 555Q62 520 94 520h184q32 0 32 35v164H62z" fill="#6A192A" stroke="#D6B873"/>
  <path d="M130 704c7-62 17-103 56-130 39 27 49 68 56 130z" fill="#F5E6E8" opacity=".32"/>
  <circle cx="186" cy="579" r="29" fill="#F4C9CC" opacity=".42"/>
  <path d="M118 552q68-68 136 0M103 710h166" fill="none" stroke="#FFFDFC" opacity=".4"/>
