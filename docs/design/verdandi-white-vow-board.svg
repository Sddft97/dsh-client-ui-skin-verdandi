  </g>

  <!-- Paired stage figures: lively barbecue left, white knight right. -->
  <g opacity=".48" stroke="#8E2438" fill="#F5DADF" stroke-width="4">
    <circle cx="500" cy="280" r="52"/><path d="M454 332l-58 210 100 52 87-68-42-194z"/><path d="M412 558l-26 156M556 548l24 165"/>
    <circle cx="1390" cy="250" r="58"/><path d="M1342 309l-72 272 116-50 106 54-49-276z"/><path d="M1290 580l-38 174M1470 580l45 174"/>
