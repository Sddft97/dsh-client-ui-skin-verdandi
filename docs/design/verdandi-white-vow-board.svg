  <text x="60" y="286" fill="#D9BD82" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700">工作区</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16">
    <text x="62" y="330" fill="#FFF7EE">♧ 深空之眼</text>
    <rect x="52" y="350" width="264" height="48" rx="8" fill="#FFF9F2" stroke="#E7D39D"/>
    <path d="M52 350l16 24-16 24" fill="#681626" opacity=".95"/>
